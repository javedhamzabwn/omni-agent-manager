[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-agent-manager"
version = "4.0.0"
description = "The Universal Control Hub & Customizer for AI Coding Agents, Models, Skills & MCP Servers"
readme = "README.md"
authors = [{ name = "Javed Hamza" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "ai-agents", "mcp", "skills", "opencode", "claude-code",
    "antigravity", "cursor", "codex", "hermes", "tui", "textual"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities"
]
dependencies = [
    "textual>=8.2.0",
    "rich>=13.0.0",
]

[project.scripts]
omni-agent = "omni_agent_manager:main"
omni-agent-manager = "omni_agent_manager:main"

[tool.setuptools]
py-modules = ["omni_agent_manager"]

